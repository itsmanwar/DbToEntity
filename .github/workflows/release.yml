# Publishes MH.DbToEntity.CLI to nuget.org with Trusted Publishing (no stored API key).
# Trigger: push a tag matching <Version> in DbToEntity.CLI.csproj, e.g.  git tag v2.0.0 && git push origin v2.0.0
#
# Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
#
# One-time setup (see docs/RELEASING.md):
#   nuget.org  -> Trusted Publishing policy: owner itsmanwar, repo DbToEntity, workflow release.yml, environment release
#   GitHub     -> environment "release" (add yourself as required reviewer) and secret NUGET_USER (nuget.org profile name)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no later step needs the token in .git/config

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test --configuration Release

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release      # waits for approval if the environment has required reviewers
    permissions:
      contents: read
      id-token: write          # lets GitHub issue the OIDC token that NuGet/login exchanges for a temporary key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no later step needs the token in .git/config

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      # nuget.org versions can't be deleted, so refuse to publish if the tag and the project disagree.
      - name: Check tag matches <Version>
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(dotnet msbuild DbToEntity.CLI/DbToEntity.CLI.csproj -getProperty:Version)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match <Version>$version</Version> in DbToEntity.CLI.csproj"
            exit 1
          fi
          echo "Publishing version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A version already published by hand (dotnet nuget push) can still be tagged: then there is nothing to do.
      - name: Skip if this version is already on nuget.org
        id: published
        run: |
          id="$(dotnet msbuild DbToEntity.CLI/DbToEntity.CLI.csproj -getProperty:PackageId | tr '[:upper:]' '[:lower:]')"
          version="${{ steps.version.outputs.version }}"
          if curl -fsS "https://api.nuget.org/v3-flatcontainer/$id/index.json" | grep -q "\"$version\""; then
            echo "::notice::$version is already on nuget.org; nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        if: steps.published.outputs.exists != 'true'
        run: dotnet pack DbToEntity.CLI --configuration Release --output artifacts -p:ContinuousIntegrationBuild=true

      # Short-lived (1 hour) API key from nuget.org; request it right before pushing.
      - name: NuGet login (OIDC -> temporary API key)
        if: steps.published.outputs.exists != 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.published.outputs.exists != 'true'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
