# Publishes MH.DbToEntity.CLI to nuget.org with Trusted Publishing (no stored API key).
# Trigger: push a tag matching <Version> in DbToEntity.CLI.csproj, e.g.  git tag v2.0.0 && git push origin v2.0.0
#
# One-time setup (see docs/RELEASING.md):
#   nuget.org  -> Trusted Publishing policy: owner itsmanwar, repo DbToEntity, workflow release.yml, environment release
#   GitHub     -> environment "release" (add yourself as required reviewer) and secret NUGET_USER (nuget.org profile name)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test --configuration Release

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release      # waits for approval if the environment has required reviewers
    permissions:
      contents: read
      id-token: write          # lets GitHub issue the OIDC token that NuGet/login exchanges for a temporary key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # nuget.org versions can't be deleted, so refuse to publish if the tag and the project disagree.
      - name: Check tag matches <Version>
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(dotnet msbuild DbToEntity.CLI/DbToEntity.CLI.csproj -getProperty:Version)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match <Version>$version</Version> in DbToEntity.CLI.csproj"
            exit 1
          fi
          echo "Publishing version $version"

      - name: Pack
        run: dotnet pack DbToEntity.CLI --configuration Release --output artifacts -p:ContinuousIntegrationBuild=true

      # Short-lived (1 hour) API key from nuget.org; request it right before pushing.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
